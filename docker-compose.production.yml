# ==============================================================================
# REACT-WebFashion — Production Docker Compose Orchestration
# Services: reverse-proxy (Nginx), frontend (SPA), api (Node.js),
#           worker (BullMQ), mongo (MongoDB 7.0), redis (Redis 7)
# Run command: docker compose -f docker-compose.production.yml up -d --build
# ==============================================================================

name: react-webfashion-prod

services:
  # ── 1. Nginx Gateway / Reverse Proxy ─────────────────────────────────────────
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: webfashion-proxy-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  # ── 2. Frontend Web Application (React SPA + Nginx) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: webfashion-frontend-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  # ── 3. Backend HTTP API Gateway ─────────────────────────────────────────────
  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    # container_name omitted to support scale: docker compose up -d --scale api=2
    env_file:
      - path: ./.env.production
        required: false
      - path: ./back-end/.env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_CONNECTIONSTRING: mongodb://${MONGO_USER:-webfashion_admin}:${MONGO_PASS:-webfashion_prod_pass}@mongo:27017/webfashion?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-webfashion_redis_secret}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACTION_SECRET: ${ACTION_SECRET}
      OTP_SECRET: ${OTP_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://fashion.example.com}
      CLIENT_URL: ${CLIENT_URL:-https://fashion.example.com}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  # ── 4. BullMQ Background Worker (Email, Analytics, Vector Sync) ────────────
  worker:
    build:
      context: ./back-end
      dockerfile: Dockerfile.worker
    container_name: webfashion-worker-prod
    env_file:
      - path: ./.env.production
        required: false
      - path: ./back-end/.env.production
        required: false
    environment:
      NODE_ENV: production
      MONGO_CONNECTIONSTRING: mongodb://${MONGO_USER:-webfashion_admin}:${MONGO_PASS:-webfashion_prod_pass}@mongo:27017/webfashion?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-webfashion_redis_secret}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACTION_SECRET: ${ACTION_SECRET}
      OTP_SECRET: ${OTP_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  # ── 5. Database: MongoDB 7.0 ────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: webfashion-mongo-prod
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-webfashion_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-webfashion_prod_pass}
      MONGO_INITDB_DATABASE: webfashion
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  # ── 6. In-Memory Cache & Message Broker: Redis 7 ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: webfashion-redis-prod
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-webfashion_redis_secret}", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-webfashion_redis_secret} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - webfashion-prod-net

volumes:
  mongo-data:
    name: webfashion-mongo-data
  redis-data:
    name: webfashion-redis-data
  uploads-data:
    name: webfashion-uploads-data
  certbot-www:
    name: webfashion-certbot-www

networks:
  webfashion-prod-net:
    name: webfashion-prod-net
    driver: bridge
