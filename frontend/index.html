<!doctype html>
<html lang="vi" data-theme="light" data-type="shop">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="WebFashion — Contemporary Luxury Atelier & Haute Tailoring" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="page-type" content="shop" />
    <meta name="site-kind" content="fashion" />
    <title>WebFashion — Haute Atelier E-Commerce</title>
    <!-- Prevent Theme Flash (FOUC) Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('webfashion_theme') || 'light';
          var resolved = saved;
          if (saved === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#171717' : '#FAF9F6');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap&subset=vietnamese,latin-ext" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap&subset=vietnamese,latin-ext" rel="stylesheet">
    </noscript>
  </head>
  <body class="antialiased selection:bg-[#e65100] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
