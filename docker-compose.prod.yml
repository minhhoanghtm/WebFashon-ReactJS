# Production Docker Compose
# Dùng trên VPS: docker compose -f docker-compose.prod.yml up -d --build
#
# Trước khi chạy:
#   1. cp .env.example back-end/.env.production  → điền giá trị thật
#   2. Cập nhật DOMAIN trong file này và nginx/nginx.conf
#   3. Đặt SSL cert vào nginx/ssl/fullchain.pem và nginx/ssl/privkey.pem

services:

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - front
    restart: unless-stopped

  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    env_file:
      - ./back-end/.env.production
    environment:
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    # Không expose port ra ngoài — nginx xử lý

  front:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    restart: unless-stopped
    # Không expose port ra ngoài

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Không expose port ra ngoài

volumes:
  mongo-data:
  certbot-www:
