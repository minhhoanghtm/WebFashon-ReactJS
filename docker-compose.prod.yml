# ==============================================================================
# REACT-WebFashion — Production Environment Docker Compose
# Deployment command: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

name: react-webfashion-prod

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: webfashion-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    env_file:
      - path: ./.env.production
        required: false
      - path: ./back-end/.env.production
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_CONNECTIONSTRING: mongodb://${MONGO_USER:-webfashion_admin}:${MONGO_PASS:-webfashion_prod_pass}@mongo:27017/webfashion?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-webfashion_redis_secret}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SOCKET_REDIS_ADAPTER_REQUIRED: "true"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACTION_SECRET: ${ACTION_SECRET}
      OTP_SECRET: ${OTP_SECRET}
      CLIENT_URL: https://${DOMAIN:-localhost}
      FRONTEND_URL: https://${DOMAIN:-localhost}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: webfashion-front-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  worker:
    build:
      context: ./back-end
      dockerfile: Dockerfile.worker
    container_name: webfashion-worker-prod
    env_file:
      - path: ./.env.production
        required: false
      - path: ./back-end/.env.production
        required: false
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_CONNECTIONSTRING: mongodb://${MONGO_USER:-webfashion_admin}:${MONGO_PASS:-webfashion_prod_pass}@mongo:27017/webfashion?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-webfashion_redis_secret}@redis:6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACTION_SECRET: ${ACTION_SECRET}
      OTP_SECRET: ${OTP_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  mongo:
    image: mongo:7.0
    container_name: webfashion-mongo-prod
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-webfashion_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-webfashion_prod_pass}
      MONGO_INITDB_DATABASE: webfashion
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - webfashion-prod-net

  redis:
    image: redis:7-alpine
    container_name: webfashion-redis-prod
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-webfashion_redis_secret}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-webfashion_redis_secret} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - webfashion-prod-net

volumes:
  mongo-data:
  redis-data:
  uploads-data:
  certbot-www:

networks:
  webfashion-prod-net:
    driver: bridge
