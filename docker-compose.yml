# ==============================================================================
# REACT-WebFashion — Local Development Docker Compose
# ==============================================================================

name: react-webfashion-dev

services:
  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: webfashion-api-dev
    ports:
      - "5001:5000"
    env_file:
      - path: ./back-end/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_CONNECTIONSTRING: mongodb://${MONGO_USER:?set MONGO_USER}:${MONGO_PASS:?set MONGO_PASS}@mongo:27017/webfashion?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTION_SECRET: ${ACTION_SECRET:?set ACTION_SECRET}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET}
      OTP_SECRET: ${OTP_SECRET:?set OTP_SECRET}
      CLIENT_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - webfashion-network

  front:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: webfashion-front-dev
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - webfashion-network

  mongo:
    image: mongo:7.0
    container_name: webfashion-mongo-dev
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?set MONGO_PASS}
      MONGO_INITDB_DATABASE: webfashion
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - webfashion-network

  redis:
    image: redis:7-alpine
    container_name: webfashion-redis-dev
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - webfashion-network

volumes:
  mongo-data:
  redis-data:
  uploads-data:

networks:
  webfashion-network:
    driver: bridge
