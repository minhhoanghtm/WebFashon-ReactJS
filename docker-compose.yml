services:
  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - ./back-end/.env
    environment:
      PORT: 5000
      MONGO_CONNECTIONSTRING: mongodb://admin:secret@mongo:27017/webfashion?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  front:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    ports:
      - "8080:80"
    env_file:
      - ./front-end/.env
    depends_on:
      - api
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mongo-data:
