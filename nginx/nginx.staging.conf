server {
    listen 80;
    server_name localhost staging.local;

    client_max_body_size 25m;

    # Backend API Gateway
    location /api/ {
        proxy_pass         http://api-staging:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket for real-time customer and support chat
    location /socket.io/ {
        proxy_pass         http://api-staging:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Static file uploads
    location /uploads/ {
        proxy_pass http://api-staging:5000/uploads/;
    }

    # Frontend React SPA
    location / {
        proxy_pass         http://front-staging:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
