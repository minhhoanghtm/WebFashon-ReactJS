name: CI - Develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test-backend:
    name: 🔍 Backend CI
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install backend dependencies
        working-directory: ./back-end
        run: npm ci

      - name: Create .env for test
        working-directory: ./back-end
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=5000
          MONGODB_URI=mongodb://localhost:27017/webfashion_test
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=test_secret_key_ci
          JWT_REFRESH_SECRET=test_refresh_secret_ci
          EOF

      - name: Run tests
        working-directory: ./back-end
        run: node test-api.js

      - name: Run scenario tests
        working-directory: ./back-end
        run: node test-scenarios.js

  build-frontend:
    name: 🏗️ Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./front-end
        run: npm ci

      - name: Build Vite
        working-directory: ./front-end
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-develop
          path: front-end/dist
          retention-days: 3
