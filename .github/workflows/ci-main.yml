name: CI - Main Production Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: 🧪 Backend CI Pipeline (Node 22)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/webfashion_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: test_access_token_secret_ci_main_32_chars
      REFRESH_TOKEN_SECRET: test_refresh_token_secret_ci_main_32_chars
      ACTION_SECRET: test_action_secret_ci_main_32_characters
      OTP_SECRET: test_otp_secret_ci_main_32_characters__

    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Create .env for test
        run: |
          TEST_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
          cat > .env << EOF
          NODE_ENV=test
          PORT=5000
          MONGO_CONNECTIONSTRING=mongodb://127.0.0.1:27017/webfashion_test
          MONGODB_URI=mongodb://127.0.0.1:27017/webfashion_test
          REDIS_URL=redis://127.0.0.1:6379
          ACCESS_TOKEN_SECRET=$TEST_SECRET
          REFRESH_TOKEN_SECRET=$TEST_SECRET
          ACTION_SECRET=$TEST_SECRET
          OTP_SECRET=$TEST_SECRET
          SMS_PROVIDER=console
          EOF

      - name: Run Backend CI pipeline (Lint, Test, Start Check)
        run: |
          npm run lint
          npm start > server.log 2>&1 &
          npx wait-on http://localhost:5000/api/health --timeout 60000 || (cat server.log && exit 1)
          npm test
          node test-api.js --if-present

  test-frontend:
    name: 🏗️ Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        working-directory: ./front-end
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run lint
        working-directory: ./front-end
        run: npm run lint

      - name: Run tests
        working-directory: ./front-end
        run: npm test

      - name: Build production bundle
        working-directory: ./front-end
        env:
          VITE_API_URL: /api
        run: npm run build

  validate-docker:
    name: 🐳 Production Docker Config Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose production & local syntax
        run: |
          export DOMAIN=example.test MONGO_USER=ci-user MONGO_PASS=ci-mongo-password ACCESS_TOKEN_SECRET=ci-access-token-secret-at-least-32 REFRESH_TOKEN_SECRET=ci-refresh-token-secret-at-least-32 ACTION_SECRET=ci-action-secret-at-least-32-chars OTP_SECRET=ci-otp-secret-at-least-32-chars STAGING_MONGO_USER=ci-user STAGING_MONGO_PASSWORD=ci-mongo-password
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.staging.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
