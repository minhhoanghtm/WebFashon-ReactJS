name: CI - Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/webfashion_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-secret

    defaults:
      run:
        working-directory: back-end

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install backend dependencies
        working-directory: ./back-end
        run: npm install --no-audit --no-fund


      - name: Run Backend CI pipeline (Lint, Test, Build)
        working-directory: ./back-end
        run: |
          npm run lint --if-present
          npm start &
          npx wait-on http://localhost:5000/api/health --timeout 30000
          npm test
          node test-api.js
          npm run build --if-present

      - name: Build Docker image
        working-directory: .
        run: docker compose build