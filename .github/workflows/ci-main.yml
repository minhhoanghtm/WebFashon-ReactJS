name: CI - Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: ⚙️ Backend CI (Lint, Test, Health Check)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_CONNECTIONSTRING: mongodb://127.0.0.1:27017/webfashion_test
      MONGODB_URI: mongodb://127.0.0.1:27017/webfashion_test
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test_jwt_secret_minimum_32_characters_123456
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_minimum_32_characters_123456
      REFRESH_TOKEN_SECRET: test_refresh_token_secret_minimum_32_characters_123456
      OTP_SECRET: test_otp_secret_key_minimum_32_characters_123456
      ACTION_SECRET: test_action_secret_key_minimum_32_characters_123456
      ACCESS_TOKEN_SECRET: test_access_token_secret_minimum_32_characters_123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install backend dependencies
        working-directory: ./back-end
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Create .env for test
        working-directory: ./back-end
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          PORT=5000
          MONGO_CONNECTIONSTRING=mongodb://127.0.0.1:27017/webfashion_test
          MONGODB_URI=mongodb://127.0.0.1:27017/webfashion_test
          REDIS_URL=redis://127.0.0.1:6379
          JWT_SECRET=test_jwt_secret_minimum_32_characters_123456
          JWT_REFRESH_SECRET=test_jwt_refresh_secret_minimum_32_characters_123456
          REFRESH_TOKEN_SECRET=test_refresh_token_secret_minimum_32_characters_123456
          OTP_SECRET=test_otp_secret_key_minimum_32_characters_123456
          ACTION_SECRET=test_action_secret_key_minimum_32_characters_123456
          ACCESS_TOKEN_SECRET=test_access_token_secret_minimum_32_characters_123456
          EOF

      - name: Run Backend Lint
        working-directory: ./back-end
        run: npm run lint --if-present

      - name: Start Backend Server & Verify Healthcheck
        working-directory: ./back-end
        run: |
          npm start > server.log 2>&1 &
          npx wait-on http://localhost:5000/api/health --timeout 60000 || (cat server.log && exit 1)
          echo "Backend server is healthy!"

      - name: Run Backend Unit & Integration Tests
        working-directory: ./back-end
        run: npm test

      - name: Run API Smoke Test
        working-directory: ./back-end
        run: timeout 30s node test-api.js || true

      - name: Run Backend Build
        working-directory: ./back-end
        run: npm run build --if-present

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-server-logs
          path: back-end/server.log
          retention-days: 7

  frontend-ci:
    name: 🎨 Frontend CI (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Frontend Directory
        id: detect
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
            echo "Frontend directory detected: frontend"
          elif [ -d "front-end" ] && [ -f "front-end/package.json" ]; then
            echo "dir=front-end" >> $GITHUB_OUTPUT
            echo "Legacy front-end directory detected: front-end"
          else
            echo "dir=none" >> $GITHUB_OUTPUT
            echo "No frontend directory found on this branch."
          fi

      - name: Setup Node.js 22 (when frontend exists)
        if: steps.detect.outputs.dir != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        if: steps.detect.outputs.dir == 'frontend'
        working-directory: ./frontend
        run: npm install --no-audit --no-fund

      - name: Run Frontend Lint & Build (New Frontend)
        if: steps.detect.outputs.dir == 'frontend'
        working-directory: ./frontend
        run: |
          npm run lint --if-present
          npm run build

      - name: Build Front-end
        if: steps.detect.outputs.dir == 'front-end'
        working-directory: ./front-end
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Notice when Frontend is not on current branch
        if: steps.detect.outputs.dir == 'none'
        run: |
          echo "✅ Skipping frontend CI step: New frontend lives on redesign-v2 branch."

  docker-ci:
    name: 🐳 Docker Container Build Check
    needs: [backend-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build -t webfashion-api:latest ./back-end

      - name: Build Frontend Docker Image (if available)
        run: |
          if [ -d "frontend" ] && [ -f "frontend/Dockerfile" ]; then
            echo "Building new frontend Docker image..."
            docker build -t webfashion-front:latest ./frontend
          elif [ -d "front-end" ] && [ -f "front-end/Dockerfile" ]; then
            echo "Building front-end Docker image..."
            docker build -t webfashion-front:latest ./front-end
          else
            echo "Frontend Dockerfile not present on this branch. API image build verified successfully."
          fi
