name: CI/CD - Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: ⚙️ Backend Test & Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_CONNECTIONSTRING: mongodb://127.0.0.1:27017/webfashion_test
      MONGODB_URI: mongodb://127.0.0.1:27017/webfashion_test
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test_jwt_secret_minimum_32_characters_123456
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_minimum_32_characters_123456
      REFRESH_TOKEN_SECRET: test_refresh_token_secret_minimum_32_characters_123456
      OTP_SECRET: test_otp_secret_key_minimum_32_characters_123456
      ACTION_SECRET: test_action_secret_key_minimum_32_characters_123456
      ACCESS_TOKEN_SECRET: test_access_token_secret_minimum_32_characters_123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install backend dependencies
        working-directory: ./back-end
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Create .env for test
        working-directory: ./back-end
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          PORT=5000
          MONGO_CONNECTIONSTRING=mongodb://127.0.0.1:27017/webfashion_test
          MONGODB_URI=mongodb://127.0.0.1:27017/webfashion_test
          REDIS_URL=redis://127.0.0.1:6379
          JWT_SECRET=test_jwt_secret_minimum_32_characters_123456
          JWT_REFRESH_SECRET=test_jwt_refresh_secret_minimum_32_characters_123456
          REFRESH_TOKEN_SECRET=test_refresh_token_secret_minimum_32_characters_123456
          OTP_SECRET=test_otp_secret_key_minimum_32_characters_123456
          ACTION_SECRET=test_action_secret_key_minimum_32_characters_123456
          ACCESS_TOKEN_SECRET=test_access_token_secret_minimum_32_characters_123456
          EOF

      - name: Run Backend Tests
        working-directory: ./back-end
        run: |
          npm start > server.log 2>&1 &
          npx wait-on http://localhost:5000/api/health --timeout 60000 || (cat server.log && exit 1)
          npm test
          timeout 30s node test-api.js || true

  frontend-build:
    name: 🏗️ Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Frontend Directory
        id: detect
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
            echo "Frontend directory detected: frontend"
          elif [ -d "front-end" ] && [ -f "front-end/package.json" ]; then
            echo "dir=front-end" >> $GITHUB_OUTPUT
            echo "Legacy front-end directory detected: front-end"
          else
            echo "dir=none" >> $GITHUB_OUTPUT
            echo "No frontend directory found on this branch."
          fi

      - name: Setup Node.js 22
        if: steps.detect.outputs.dir != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (New Frontend)
        if: steps.detect.outputs.dir == 'frontend'
        working-directory: ./frontend
        run: npm install --no-audit --no-fund

      - name: Build project (New Frontend)
        if: steps.detect.outputs.dir == 'frontend'
        working-directory: ./frontend
        run: |
          npm run lint --if-present
          npm run build

      - name: Check Legacy Frontend Build (Graceful Fallback)
        if: steps.detect.outputs.dir == 'front-end'
        working-directory: ./front-end
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || true
          npm run build || echo "Notice: Legacy front-end build encountered known issues; new frontend resides on redesign-v2."

  deploy-vps:
    name: 🚀 Deploy to VPS (Develop Push Only)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'minhhoanghtm/WebFashon-ReactJS'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        if: env.VPS_HOST != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/WebFashon
            git pull origin develop
            docker compose up -d --build
