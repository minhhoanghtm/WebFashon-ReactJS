name: react-webfashion

services:
  nginx-staging:
    image: nginx:stable-alpine
    container_name: webfashion-nginx-staging
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-staging
      - front-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-staging:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: webfashion-api-staging
    ports:
      - "5050:5000"
    env_file:
      - ./back-end/.env.staging
    environment:
      PORT: 5000
      NODE_ENV: staging
      MONGO_CONNECTIONSTRING: mongodb://staging_admin:staging_secret@mongo-staging:27017/webfashion_staging?authSource=admin
      REDIS_URL: redis://redis-staging:6379
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: staging_access_token_secret_wf2026_super_secure_staging_key
      JWT_SECRET: staging_access_token_secret_wf2026_super_secure_staging_key
      ACTIVE_REC_EXPERIMENT_ID: AA_Recommendation_Validation
      CLIENT_URL: http://localhost:8081
      FRONTEND_URL: http://localhost:8081
    depends_on:
      mongo-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-staging:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    command: ["node", "src/worker.js"]
    env_file:
      - ./back-end/.env.staging
    environment:
      NODE_ENV: staging
      MONGO_CONNECTIONSTRING: mongodb://staging_admin:staging_secret@mongo-staging:27017/webfashion_staging?authSource=admin
      REDIS_URL: redis://redis-staging:6379
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: staging_access_token_secret_wf2026_super_secure_staging_key
      JWT_SECRET: staging_access_token_secret_wf2026_super_secure_staging_key
      ACTIVE_REC_EXPERIMENT_ID: AA_Recommendation_Validation
    depends_on:
      mongo-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    restart: unless-stopped

  front-staging:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8081/api
    container_name: webfashion-front-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo-staging:
    image: mongo:7.0
    container_name: webfashion-mongo-staging
    volumes:
      - mongo-staging-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: staging_admin
      MONGO_INITDB_ROOT_PASSWORD: staging_secret
      MONGO_INITDB_DATABASE: webfashion_staging
    ports:
      - "27018:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis-staging:
    image: redis:7-alpine
    container_name: webfashion-redis-staging
    ports:
      - "6381:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-staging-data:
