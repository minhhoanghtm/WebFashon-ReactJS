services:
  nginx-staging:
    image: nginx:stable-alpine
    container_name: webfashion-nginx-staging
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-staging
      - front-staging
    restart: unless-stopped

  api-staging:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: webfashion-api-staging
    ports:
      - "5050:5000"
    env_file:
      - ./back-end/.env.staging
    environment:
      PORT: 5000
      NODE_ENV: staging
      MONGO_CONNECTIONSTRING: mongodb://staging_admin:staging_secret@mongo-staging:27017/webfashion_staging?authSource=admin
      REDIS_URL: redis://redis-staging:6379
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      ACTIVE_REC_EXPERIMENT_ID: AA_Recommendation_Validation
      CLIENT_URL: http://localhost:8088
      FRONTEND_URL: http://localhost:8088
    depends_on:
      - mongo-staging
      - redis-staging
    restart: unless-stopped

  front-staging:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8088/api
    container_name: webfashion-front-staging
    restart: unless-stopped

  mongo-staging:
    image: mongo:7.0
    container_name: webfashion-mongo-staging
    volumes:
      - mongo-staging-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: staging_admin
      MONGO_INITDB_ROOT_PASSWORD: staging_secret
      MONGO_INITDB_DATABASE: webfashion_staging
    ports:
      - "27018:27017"
    restart: unless-stopped

  redis-staging:
    image: redis:7-alpine
    container_name: webfashion-redis-staging
    ports:
      - "6381:6379"
    restart: unless-stopped

volumes:
  mongo-staging-data:
