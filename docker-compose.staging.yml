# ==============================================================================
# REACT-WebFashion — Staging Environment Docker Compose
# ==============================================================================

name: react-webfashion

services:
  nginx-staging:
    image: nginx:stable-alpine
    container_name: webfashion-nginx-staging
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-staging:
        condition: service_healthy
      front-staging:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - webfashion-staging-net

  api-staging:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: webfashion-api-staging
    ports:
      - "5050:5000"
    env_file:
      - path: ./back-end/.env.staging
        required: false
    environment:
      PORT: 5000
      NODE_ENV: staging
      MONGO_CONNECTIONSTRING: mongodb://${STAGING_MONGO_USER:?set STAGING_MONGO_USER}:${STAGING_MONGO_PASSWORD:?set STAGING_MONGO_PASSWORD}@mongo-staging:27017/webfashion_staging?authSource=admin
      REDIS_URL: redis://redis-staging:6379
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ACTION_SECRET: ${ACTION_SECRET:?set ACTION_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET}
      OTP_SECRET: ${OTP_SECRET:?set OTP_SECRET}
      ACTIVE_REC_EXPERIMENT_ID: AA_Recommendation_Validation
      CLIENT_URL: http://localhost:8081
      FRONTEND_URL: http://localhost:8081
    volumes:
      - uploads-staging-data:/app/uploads
    depends_on:
      mongo-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - webfashion-staging-net

  worker-staging:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    command: ["node", "src/worker.js"]
    container_name: webfashion-worker-staging
    env_file:
      - path: ./back-end/.env.staging
        required: false
    environment:
      NODE_ENV: staging
      MONGO_CONNECTIONSTRING: mongodb://${STAGING_MONGO_USER:?set STAGING_MONGO_USER}:${STAGING_MONGO_PASSWORD:?set STAGING_MONGO_PASSWORD}@mongo-staging:27017/webfashion_staging?authSource=admin
      REDIS_URL: redis://redis-staging:6379
      REDIS_HOST: redis-staging
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ACTION_SECRET: ${ACTION_SECRET:?set ACTION_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET}
      OTP_SECRET: ${OTP_SECRET:?set OTP_SECRET}
      ACTIVE_REC_EXPERIMENT_ID: AA_Recommendation_Validation
    volumes:
      - uploads-staging-data:/app/uploads
    depends_on:
      mongo-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webfashion-staging-net

  front-staging:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8081/api
    container_name: webfashion-front-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - webfashion-staging-net

  mongo-staging:
    image: mongo:7.0
    container_name: webfashion-mongo-staging
    volumes:
      - mongo-staging-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${STAGING_MONGO_USER:?set STAGING_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${STAGING_MONGO_PASSWORD:?set STAGING_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: webfashion_staging
    ports:
      - "27018:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - webfashion-staging-net

  redis-staging:
    image: redis:7-alpine
    container_name: webfashion-redis-staging
    volumes:
      - redis-staging-data:/data
    ports:
      - "6381:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - webfashion-staging-net

volumes:
  mongo-staging-data:
  redis-staging-data:
  uploads-staging-data:

networks:
  webfashion-staging-net:
    driver: bridge
